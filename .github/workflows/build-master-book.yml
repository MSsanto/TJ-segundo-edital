name: Build master apostilas PDF

on:
  push:
    paths:
      - 'livros/por_materia/**'
      - 'scripts/build_master_book.py'
      - 'scripts/apply_branding.py'
      - '.github/workflows/build-master-book.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: master-apostilas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pandoc and XeLaTeX
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y pandoc texlive-xetex texlive-latex-extra texlive-latex-recommended texlive-fonts-recommended texlive-lang-portuguese

      - name: Install PDF branding dependency
        run: python -m pip install pymupdf

      - name: Render consolidated PDF
        run: python scripts/build_master_book.py

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: tjsp-apostilas-por-materia
          path: pdfs/livros/TJSP_2027_Todas_As_Apostilas_Por_Materia.pdf
          if-no-files-found: error

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdfs/livros/TJSP_2027_Todas_As_Apostilas_Por_Materia.pdf
          if git diff --cached --quiet; then
            echo "PDF sem alterações."
          else
            git commit -m "build: render apostila-mestre por matéria"
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
